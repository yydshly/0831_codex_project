        <p class="eyebrow">EARLY.TOOLS · 中文能力地图</p>
        <h1>早期项目的情报库、发布入口与创始人工具箱</h1>
        <p>
          early.tools 收集并策展处于 Waitlist、Alpha、Beta、Early 和 Public
          阶段的第三方产品。它不生产这些产品，而是帮助用户发现、帮助创始人发布，并通过会员和赞助形成商业闭环。
        </p>
        <h2>对我们的意义</h2>
        <p>
          它可以作为新产品研究入口、项目发布渠道、竞品与趋势样本库，也提供“结构化目录 + 生命周期 +
          内容分发”的可复用产品模式。
        </p>
        <h2>信息来源</h2>
        <p>
          数据来自创始人提交、运营者人工发现、公开网站与社交资料、平台生命周期观测以及用户行为。
          公开页面没有逐字段来源和检测方法，因此重要结论仍需回到原始来源核验。
        </p>
        <h2>边界</h2>
        <p>
          本页面是独立研究 Demo，不属于 early.tools，不复制其界面或会员内容。数据固定到 2026-09-01
          公开快照。完整交互需要启用 JavaScript。
        </p>
