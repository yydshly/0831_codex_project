        <h1>Write Then Publish 独立研究档案</h1>
        <p>
          这是一个独立研究 Demo。上游项目定位于中文内容的发布前排版：同一份 Markdown
          可以输出图文卡片、公众号长文与可下载素材，并覆盖图片、Obsidian 和 Live Photo 工作流。
        </p>
        <h2>边界</h2>
        <p>
          本 Demo 不复制上游界面、代码或素材，也不执行真实 PNG、ZIP、Live Photo 编码、账号同步或平台发布。
          上述动态演示需要启用 JavaScript；这份核心结论在无脚本环境中仍可阅读。
        </p>
        <h2>适用场景</h2>
        <p>
          适合用 Markdown / Obsidian 写作、需要重复输出小红书卡片和公众号长文的个人创作者；不适合作为无需改造的商业 SaaS、团队审批系统或全自动多平台发布器。
        </p>
      </main>
    </noscript>
