name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'apps/botvod-capability-lab/**'
      - 'apps/early-tools-capability-lab/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/botvod-capability-lab/package-lock.json
            apps/early-tools-capability-lab/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: apps/early-tools-capability-lab
        run: npm ci

      - name: Build early.tools Capability Lab
        working-directory: apps/early-tools-capability-lab
        run: npm run build

      - name: Install BotVod Capability Lab dependencies
        working-directory: apps/botvod-capability-lab
        run: npm ci

      - name: Build BotVod Capability Lab
        working-directory: apps/botvod-capability-lab
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p pages-dist/demos/botvod-capability-lab
          mkdir -p pages-dist/demos/early-tools-capability-lab
          cp site/index.html pages-dist/index.html
          cp -R apps/botvod-capability-lab/dist/. pages-dist/demos/botvod-capability-lab/
          cp -R apps/early-tools-capability-lab/dist/. pages-dist/demos/early-tools-capability-lab/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
